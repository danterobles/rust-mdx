name: Release

# Se dispara al empujar un tag `vX.Y.Z` (los tags los crea solo el propietario).
on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  verify:
    name: verificar versión
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: El tag coincide con Cargo.toml, Packager.toml y CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          pack_v=$(grep -m1 '^version' Packager.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "tag=$tag Cargo.toml=$cargo_v Packager.toml=$pack_v"
          [ "$tag" = "$cargo_v" ] && [ "$tag" = "$pack_v" ]
          grep -q "^## \[$tag\]" CHANGELOG.md

  package:
    name: paquetes (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            formats: appimage,deb
          - os: macos-latest
            formats: dmg
          - os: windows-latest
            formats: wix
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev pkg-config libfuse2
      - name: Instalar cargo-packager
        run: cargo install cargo-packager --locked
      # macOS: binario universal (x86_64 + arm64) con lipo.
      - name: Binario universal (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p mdx-app --target aarch64-apple-darwin
          cargo build --release -p mdx-app --target x86_64-apple-darwin
          mkdir -p target/universal/release
          lipo -create -output target/universal/release/mdx \
            target/aarch64-apple-darwin/release/mdx target/x86_64-apple-darwin/release/mdx
          lipo -info target/universal/release/mdx
      # La firma (US-5.2) se parametriza con secrets; ver docs/release.md. Sin ellos se publica sin firmar.
      - name: Empaquetar
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.CARGO_PACKAGER_SIGN_PRIVATE_KEY }}
        run: |
          extra=""
          if [ "$RUNNER_OS" = "macOS" ]; then extra="--binaries-dir target/universal/release"; fi
          cargo packager --release --formats ${{ matrix.formats }} $extra
      - uses: actions/upload-artifact@v4
        with:
          name: paquetes-${{ matrix.os }}
          path: |
            target/packager/*.dmg
            target/packager/*.msi
            target/packager/*.AppImage
            target/packager/*.deb
          if-no-files-found: error

  release:
    name: publicar release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Notas = sección del CHANGELOG de esta versión
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "RustMDX $GITHUB_REF_NAME" --notes-file notes.md
