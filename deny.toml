[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "OFL-1.1",
  "BSL-1.0",   # clipboard-win, error-code (transitivas de iced)
  "NCSA",      # libfuzzer-sys (transitiva: image → rav1e)
  "Unicode-DFS-2016",   # finl_unicode (transitiva de comrak); equivalente a Unicode-3.0
]

[licenses.private]
ignore = true   # crates del workspace (publish = false)

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
